<html>
    <head>
        <title>Cruise API - Step Up</title>
        <style>
        * {
            margin: 0;
            padding: 0;
        }

        .hide {
            display: none;
        }

        #stepUpView {
            width: 100%;
            height: 100%
        }

        #stepUpView iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loadingImage {
            height: 30px;
            width: 30px;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transform: -webkit-translate(-50%, -50%);
            transform: -moz-translate(-50%, -50%);
            transform: -ms-translate(-50%, -50%);
        }

        .outOfview{
            position: absolute;
            left: -2000px;
            top: -2000px;
        }
    </style>
    </head>
    <body>
        <div id="stepUpView"></div>
        <div class="hide">
            <input id="acsUrl" name="acsUrl" value="https://cas.client.cardinaltrusted.com/merchantacs/threeds/v2/creq" type="hidden"/>
            <input id="payload" name="payload" value="eyJtZXNzYWdlVHlwZSI6IkNSZXEiLCJtZXNzYWdlVmVyc2lvbiI6IjIuMi4wIiwidGhyZWVEU1NlcnZlclRyYW5zSUQiOiJmZmU3ZWZlZS1jNTUwLTRjMDktOTgzOS0wOGQzYTJhOWRlNzgiLCJhY3NUcmFuc0lEIjoiZmY0MmExNDMtY2QzNC00Nzg5LWJhNjgtMzFlN2I4NTg5MWQ3IiwiY2hhbGxlbmdlV2luZG93U2l6ZSI6IjAyIn0" type="hidden"/>
            <input id="mcsId" name="mcsId" value="MF9mMzFmMzIxYi02MjU4LTRhNzUtOTI0Ny00YmFhMDYwNDdkNzc" type="hidden"/>
            <input id="termUrl" name="termUrl" value="https://cas.client.cardinaltrusted.com/centinelapi/V1/TermURL/Overlay/CCA" type="hidden"/>
            <input id="threeDSVersion" name="threeDSVersion" value="2" type="hidden"/>
            <input id="baseUrl" name="baseUrl" value="https://cas.client.cardinaltrusted.com/centinelapi" type="hidden"/>
            <input id="orgUnitId" name="orgUnitId" value="5e02441190d741214c11a686" type="hidden"/>
            <input id="transactionId" name="transactionId" value="xqrTV0ygvqQmLvFoUNO3" type="hidden"/>
            <input id="isPostMessageEventsEnabled" name="isPostMessageEventsEnabled" value="false" type="hidden"/>
            <input id="merchantData" name="merchantData" value="128d7298-ac84-482b-a30d-155ebc917b8b" type="hidden"/>
            <input id="usePostMessageCompletion" name="usePostMessageCompletion" value="false" type="hidden"/>
            <input id="useMetaTag" name="useMetaTag" value="true" type="hidden"/>
            <input id="iframeSandboxEnabled" name="iframeSandboxEnabled" value="true" type="hidden"/>
            <input id="iframeAllowEnabled" name="iframeAllowEnabled" value="true" type="hidden"/>
        </div>
        <div class="hide">
            <form id="redirect" method="POST" action="https://cas.client.cardinaltrusted.com/centinelapi/V1/Cruise/TermRedirection">
                <input type="hidden" name="McsId" id="redirect-mcsId" value="0_f31f321b-6258-4a75-9247-4baa06047d77"/>
                <input type="hidden" name="CardinalJWT" id="CardinalJWT"/>
                <input type="hidden" name="Error" id="Error"/>
            </form>
        </div>
        <script src="https://cas.client.cardinaltrusted.com/centinelapi/javascript/vendors.03e78e70cc47ab8899ab.js"></script>
        <script src="https://cas.client.cardinaltrusted.com/centinelapi/javascript/stepUp.8637a6ad2fbc7d39dc77.js"></script>
        <script>
    window.onload = function () {
        try {
            if (window.CruiseAPI !== undefined) {
                var configuration = {
                    acsUrl: document.getElementById('acsUrl').value,
                    baseUrl: document.getElementById('baseUrl').value,
                    encodedMcsId: document.getElementById('mcsId').value,
                    mcsId: document.getElementById('redirect-mcsId').value,
                    orgUnitId: document.getElementById('orgUnitId').value,
                    payload: document.getElementById('payload').value,                    
                    termUrl: document.getElementById('termUrl').value,
                    threeDSVersion: document.getElementById('threeDSVersion').value,
                    transactionId: document.getElementById('transactionId').value,
                    isPostMessageEventsEnabled: document.getElementById('isPostMessageEventsEnabled').value,
                    merchantData: document.getElementById('merchantData').value,
                    usePostMessageCompletion: document.getElementById('usePostMessageCompletion').value,
                    useMetaTag: document.getElementById('useMetaTag').value,
                    iframeSandboxEnabled: document.getElementById('iframeSandboxEnabled').value,
                    iframeAllowEnabled: document.getElementById('iframeAllowEnabled').value

                };

                CruiseAPI.stepUp.run(configuration)
            } else {
                console.error('Global not found, unable to complete step up');
                document.getElementById("Error").value = "JS Global not found";
                document.getElementById("redirect").submit();
            }
        }catch(error) {            
            if(window.CruiseAPI !== undefined){
                CruiseAPI.stepUp.handleError(error.message);
            } else {
                console.error(error);
            }
        }
    }
</script>
    </body>
</html>
